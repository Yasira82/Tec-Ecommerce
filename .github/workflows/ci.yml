name: CI

on:
  # `claude/**` removed from the PUSH trigger. Every one of those branches has an
  # open PR, so `pull_request` already covers it — carrying both meant each push
  # to a working branch started TWO full pipelines for one commit, and only this
  # repo did it. `concurrency` cannot help: the two runs have different
  # `github.ref` values, so they are not superseded runs, they are duplicates.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


permissions:
  contents: read

jobs:
  # ── ONE job, ONE install ──────────────────────────────────────────────────
  #
  # This was five jobs. They were correct and they were expensive, for two
  # reasons that compound:
  #
  #   1. FOUR of them ran `npm install` — the same install, four times, on four
  #      runners, for one commit.
  #   2. GitHub bills each job ROUNDED UP TO THE MINUTE. The policy job is a
  #      handful of greps that finish in seconds and cost a full minute anyway.
  #      Five jobs means five roundings before any real work is counted.
  #
  # Splitting them bought parallelism — a faster red light. On a platform built
  # by one person, wall-clock minutes are worth far less than the bill, and in
  # September 2026 the Actions budget reached 98% of its cap with `Stop usage`
  # armed, which would have frozen every open PR across 29 repos.
  #
  # Nothing is dropped. Every check that ran before still runs, in the order a
  # failure is cheapest to find: the greps need no install and go first; a type
  # error stops the run before the test suite and the build.
  #
  # e2e stays a separate workflow ON PURPOSE. It builds with different
  # `NEXT_PUBLIC_*` values (localhost gateway + E2E_MODE), and those are inlined
  # at BUILD time — so its build is a genuinely different artifact that this one
  # cannot stand in for.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Drift Detection — KB claims vs code
        run: "violations=0\n\n# ── ADR-009: unified payment contract ───────────────────────────\nif grep -rniE 'x-service-secret|SERVICE_SECRET' src; then\n  echo \"::error::ADR-009: use x-internal-key / INTERNAL_SECRET (not x-service-secret / SERVICE_SECRET)\"\n  violations=1\nfi\nif grep -rnE 'amount:[[:space:]]*z\\.string' src | grep -qi payment; then\n  echo \"::error::ADR-009: payment amount must be a number — no z.string() for amount in payment routes\"\n  violations=1\nfi\n\n# ── C-12 §11 / P2: CSRF enforced ONLY in middleware ─────────────\nif grep -rnE 'csrfCookie !== csrfHeader|csrfCookie === csrfHeader|CSRF validation failed|CSRF token mismatch' src/app/api 2>/dev/null; then\n  echo \"::error::CSRF must be enforced ONLY in middleware (P2 single source of truth). Remove route-level CSRF checks — they 403 legit Pi-Browser payments.\"\n  violations=1\nfi\n\n# ── C-76 / ADR-007: every Mode-2 buy handler must guard ─────────\n# Any component/page triggering createU2APayment() must check\n# isHubNavigation() first (pi-test diagnostic harness is exempt).\nhandlers=$(grep -rlE 'createU2APayment\\(' src/app src/components --include=*.tsx 2>/dev/null | grep -v '/pi-test/' || true)\nfor f in $handlers; do\n  if ! grep -qE 'isHubNavigation' \"$f\"; then\n    echo \"::error::ADR-007 (C-76): $f triggers a Mode-2 Pi payment without isHubNavigation() guard\"\n    violations=1\n  fi\ndone\n\n[ \"$violations\" -eq 0 ] && echo \"Drift Detection OK — code matches KB claims\" || exit 1\n"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm install --legacy-peer-deps
      - name: Update TEC packages
        run: npm install @yasser172/tec-ui@latest @yasser172/tec-auth@latest --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Update TEC packages
        run: npm install @yasser172/tec-ui@latest @yasser172/tec-auth@latest --legacy-peer-deps
      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Update TEC packages
        run: npm install @yasser172/tec-ui@latest @yasser172/tec-auth@latest --legacy-peer-deps
      - name: Test
        run: npm test
      - name: Update TEC packages
        run: npm install @yasser172/tec-ui@latest @yasser172/tec-auth@latest --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_PI_SANDBOX: 'false'
          NEXT_PUBLIC_PI_APP_ID: ${{ secrets.NEXT_PUBLIC_PI_APP_ID || 'test-app-id' }}
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL || 'https://api-gateway-production-6a68.up.railway.app' }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET || 'ci-test-secret-minimum-32-chars!!' }}
